services:
  # 1. FastAPI Web Service
  - type: web
    name: certificate-generator-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: certificate-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: certificate-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: certificate-redis
          property: connectionString
      - key: DATABASE_URL
        value: sqlite:///./certificates.db

  # 2. Celery Background Worker
  - type: worker
    name: certificate-celery-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: certificate-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: certificate-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: certificate-redis
          property: connectionString
      - key: DATABASE_URL
        value: sqlite:///./certificates.db

  # 3. Redis Instance
  - type: redis
    name: certificate-redis
    ipAllowList: []
